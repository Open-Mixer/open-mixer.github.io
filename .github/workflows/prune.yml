name: Prune the package repository

# Keeps the newest 3 builds of every RPM and DEB package per distro and architecture (input newest, owner's
# ruling of 2026-11-08) plus the pinned versions, and removes everything else. Run by hand, from main. The pinned
# versions are keep.yml's, the generated channel/keep-list.txt of Open-Mixer/.github (the pins of the worker
# image, the Zynthian omx-track install sets, plugin-qualify and .github/pins.txt, one line each naming its pin;
# a line the channel does not serve fails the plan) and the ones openmixer's main and integration/* branches pin (.github/pins.txt, the @openmixer
# specifiers of packages/*/package.json and pnpm-lock.yaml), read by .github/prune/pins.mjs; a plan that would
# delete a pinned version fails, and so does one that leaves a kept package uninstallable (a dependency, a rich
# range like (a >= 1 with a < 2) included, whose only satisfier it deletes).
#
# drop (a list of name@version) switches to drop mode: those versions of those source packages go, every build of
# them, and everything else stays whatever its age. A pinned version, or one a kept package needs, fails the plan.
#
# apply=false (the default) is a dry run: it prints, per package and format, what would be kept and what
# deleted, writes that plan to the job summary and as an artifact, and changes nothing.
# apply=true deletes the plan's files from rpm/ and deb/, regenerates and re-signs the dnf metadata and the
# apt index with the release workflows' own scripts (Open-Mixer/.github publish-rpms and publish-debs), pushes ONE
# signed commit (the rpm job hands its result to the deb job, which pushes both: one Pages deployment),
# and then checks that every kept version installs (dnf in fedora:44, apt in debian:bookworm) and that the
# newest of each is what resolves.
# The apply works on the commit the plan was made from or not at all: a publish that lands on main between the
# plan and the push stops it with nothing pushed (.github/prune/unmoved.sh, checked after each pull, before the
# metadata is regenerated and before the push), and the prune is run again.
# npm is not pruned: old @openmixer versions stay published (ruled 2026-11-02, #2).
# Git tags and GitHub releases are not touched.
#
# Secrets, as the release workflows use them (Open-Mixer/.github build-rpm.yml and build-deb.yml):
#   OPENMIXER_PACKAGES_SIGNING_KEY   signs the dnf metadata and the apt index
#   RPM_GPG_KEY, RPM_GPG_PASSPHRASE  the original key, co-signs the apt index when this repository may read it
#   PAGES_TOKEN, SITE_GPG_KEY        push to this repository, signed
#   OPENMIXER_READ_TOKEN             reads Open-Mixer/openmixer while it is private; not needed once it is public

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete for real. false only prints what would be deleted.'
        type: boolean
        default: false
      drop:
        description: 'Drop mode: name@version,... removes every build of those source versions (subpackages, architectures, source) and nothing else; newest does not apply. Empty runs the normal prune.'
        type: string
        default: ''
      newest:
        description: 'How many of the newest builds of every package to keep per distro and architecture.'
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The selection is tested
        run: node --test .github/prune/test/*.test.mjs
      - name: What openmixer pins
        env:
          TOKEN: ${{ secrets.OPENMIXER_READ_TOKEN }}
        run: |
          set -euo pipefail
          url=https://github.com/Open-Mixer/openmixer.git
          git init -q openmixer
          if [ -n "$TOKEN" ]; then
            git -C openmixer config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
          git -C openmixer fetch -q --depth 1 --no-tags "$url" \
            '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/integration/*:refs/remotes/origin/integration/*'
          node .github/prune/pins.mjs --repo openmixer --json pins.json | tee pins.txt
          rm -rf openmixer
      - name: The generated keep-list
        run: |
          set -euo pipefail
          # the pins of our own work, one line each naming the pin (Open-Mixer/.github channel/gen-keep-list.mjs)
          curl -fsSL --retry 5 -o keep-list.txt https://raw.githubusercontent.com/Open-Mixer/.github/main/channel/keep-list.txt
      - name: What would be kept and deleted
        id: plan
        env:
          NEWEST: ${{ inputs.newest }}
          DROP: ${{ inputs.drop }}
        run: |
          set -o pipefail
          node .github/prune/select.mjs --keep keep.yml --pins pins.json --keeplist keep-list.txt --newest "$NEWEST" --drop "$DROP" --tree . --json plan.json --delete-list | tee plan.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > plan.sha
          { echo '### What openmixer pins'; echo '```'; cat pins.txt; echo '```';
            echo '### Package repository'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prune-plan
          path: |
            plan.json
            plan.txt
            plan.sha
            pins.json
            pins.txt
            keep-list.txt
          retention-days: 30

  rpm:
    name: Prune rpm/
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    env:
      NEWEST: ${{ inputs.newest }}
      DROP: ${{ inputs.drop }}
    steps:
      - name: Install the packaging tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils diffutils git curl python3-rpm zstd

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the scripts the release workflows publish with, at the same ref they use
      - uses: actions/checkout@v4
        with:
          repository: Open-Mixer/.github
          ref: v1
          path: .fmx

      - uses: actions/checkout@v4
        with:
          path: .self
          sparse-checkout: |
            keep.yml
            .github/prune
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: prune-plan
          path: plan

      - uses: Open-Mixer/.github/.github/actions/import-gpg-key@openmixer-v1
        with:
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}

      - uses: Open-Mixer/.github/.github/actions/channel-pull@openmixer-v1
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ github.repository }}

      # the plan holds for the planned tree only: a publish that landed since stops the prune (.github/prune/unmoved.sh)
      - name: The tree is the one the plan was made from
        env:
          PLANNED: ${{ needs.plan.outputs.sha }}
          PUBLISH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: .self/.github/prune/unmoved.sh build/channel "$PLANNED"

      - name: Check the signing key is one the channel serves
        run: .fmx/.github/actions/import-gpg-key/channel-keys.sh check build/channel/rpm/RPM-GPG-KEY-openmixer "$OPENMIXER_GPG_KEY_ID"

      - name: Delete what the plan deletes
        run: |
          set -euo pipefail
          node -e '
            const p = require("./plan/plan.json");
            for (const f of [...p.delete.map((r) => r.path), ...p.orphans]) if (f.startsWith("rpm/")) console.log(f);
          ' > rpm-delete.txt
          while IFS= read -r f; do rm -v "build/channel/$f"; done < rpm-delete.txt
          # what is left in the per-release trees is exactly what the plan keeps (the release package beside them stays)
          diff <(node -e 'for (const r of require("./plan/plan.json").keep) if (r.path.startsWith("rpm/")) console.log(r.path)' | sort) \
               <(cd build/channel && find rpm/fedora -name '*.rpm' | sort)

      - name: Main has not moved since the plan, before the metadata is regenerated
        env:
          PLANNED: ${{ needs.plan.outputs.sha }}
          PUBLISH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: .self/.github/prune/unmoved.sh build/channel "$PLANNED"

      - name: Regenerate and sign the metadata
        run: |
          set -euo pipefail
          # publish-tree.sh adds the packages of a directory and rewrites the metadata of every directory of
          # the tree; given the kept packages it adds nothing, and the metadata describes only them
          # (only the per-release trees: the release package beside them would be filed again under its fixed name)
          mkdir staging
          find build/channel/rpm/fedora -name '*.rpm' -exec cp -t staging {} +
          .fmx/.github/actions/publish-rpms/publish-tree.sh build/channel/rpm staging "$OPENMIXER_GPG_KEY_ID"
          for d in build/channel/rpm/fedora/*/*/; do
            test -s "$d/repodata/repomd.xml.asc" || { echo "::error::$d has no signed metadata"; exit 1; }
          done

      - name: The pruned tree has nothing left to delete
        run: node .self/.github/prune/select.mjs --keep .self/keep.yml --pins plan/pins.json --keeplist plan/keep-list.txt --newest "$NEWEST" --drop "$DROP" --tree build/channel --only rpm --expect-clean

      # nothing is pushed here: the deb job pushes rpm and deb in ONE signed commit, so Pages deploys once (three
      # deploys timed out at the 10-minute limit on 2026-11-07). What this job changed is the deletions and the
      # regenerated, re-signed repodata of every directory.
      - name: Hand the pruned rpm tree to the deb job
        run: |
          set -euo pipefail
          cp rpm-delete.txt build/channel/.rpm-delete.txt
          tar -C build/channel -czf rpm-handover.tgz .rpm-delete.txt $(cd build/channel && find rpm -type d -name repodata)
          ls -l rpm-handover.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-handover
          path: rpm-handover.tgz
          retention-days: 7

  deb:
    name: Prune deb/
    needs: [plan, rpm]
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:bookworm
    # the plan-matches step ran under dash after the channel pull and died on `set -o pipefail`
    # (exit 2, both apply runs of 2026-10-26); every step of this job reads as bash
    defaults:
      run:
        shell: bash
    env:
      HAS_COSIGN: ${{ secrets.RPM_GPG_KEY != '' }}
      NEWEST: ${{ inputs.newest }}
      DROP: ${{ inputs.drop }}
    steps:
      - name: Install the packaging tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg git curl ca-certificates findutils dpkg-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/checkout@v4
        with:
          repository: Open-Mixer/.github
          ref: v1
          path: .fmx

      - uses: actions/checkout@v4
        with:
          path: .self
          sparse-checkout: |
            keep.yml
            .github/prune
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: prune-plan
          path: plan

      - uses: Open-Mixer/.github/.github/actions/import-gpg-key@openmixer-v1
        with:
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}

      # the original key co-signs the apt index while installs may hold only it, as in build-deb.yml
      - uses: Open-Mixer/.github/.github/actions/import-gpg-key@openmixer-v1
        if: env.HAS_COSIGN == 'true'
        with:
          gpg-key: ${{ secrets.RPM_GPG_KEY }}
          gpg-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          id-variable: OPENMIXER_GPG_COSIGN_KEY_ID

      - uses: Open-Mixer/.github/.github/actions/channel-pull@openmixer-v1
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ github.repository }}

      # 2026-11-09: this pull came an hour after the plan and held a release's rpms; the rpm half laid the
      # metadata of the planned tree over them and the push dropped them from dnf. The rpm half describes the
      # planned tree and nothing else, so this pull must be that tree (.github/prune/unmoved.sh).
      - name: The pull is the tree the plan was made from
        env:
          PLANNED: ${{ needs.plan.outputs.sha }}
          PUBLISH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: .self/.github/prune/unmoved.sh build/channel "$PLANNED"

      # the rpm half, pruned and re-signed by the rpm job: applied to this pull, committed with the deb half
      - uses: actions/download-artifact@v4
        with:
          name: rpm-handover
          path: handover

      - name: Apply the rpm half
        run: |
          set -euo pipefail
          tar -C build/channel -xzf handover/rpm-handover.tgz
          while IFS= read -r f; do rm -v "build/channel/$f"; done < build/channel/.rpm-delete.txt
          rm build/channel/.rpm-delete.txt
          # staged now; channel-push commits the staged rpm tree together with the deb tree
          git -C build/channel add -A rpm
          test -n "$(find build/channel/rpm -name repomd.xml | head -1)" || { echo "::error::the handover carried no repodata"; exit 1; }

      # the apt half is planned again on the pulled tree and must match
      - name: The tree is the one the plan was made from
        run: |
          set -euo pipefail
          node .self/.github/prune/select.mjs --keep .self/keep.yml --pins plan/pins.json --keeplist plan/keep-list.txt --newest "$NEWEST" --drop "$DROP" --tree build/channel --only deb --json now.json > /dev/null
          node -e '
            const a = require("./plan/plan.json"), b = require("./now.json");
            const pick = (p) => JSON.stringify({ keep: p.keep.filter((r) => r.format === "deb").map((r) => r.path).sort(),
              delete: [...p.delete.filter((r) => r.format === "deb").map((r) => r.path), ...p.orphans.filter((f) => f.startsWith("deb/"))].sort() });
            if (pick(a) !== pick(b)) { console.error("::error::deb/ changed since the plan: run the prune again"); process.exit(1); }
          '

      - name: Check the signing keys are ones the channel serves
        run: |
          # shellcheck disable=SC2086 # the co-signer is one fingerprint or empty
          .fmx/.github/actions/import-gpg-key/channel-keys.sh check build/channel/deb/openmixer.asc \
            "$OPENMIXER_GPG_KEY_ID" ${OPENMIXER_GPG_COSIGN_KEY_ID:-}

      - name: Delete what the plan deletes
        run: |
          set -euo pipefail
          node -e '
            const p = require("./plan/plan.json");
            for (const f of [...p.delete.map((r) => r.path), ...p.orphans]) if (f.startsWith("deb/")) console.log(f);
          ' > deb-delete.txt
          while IFS= read -r f; do rm -v "build/channel/$f"; done < deb-delete.txt
          diff <(node -e 'for (const r of require("./plan/plan.json").keep) if (r.path.startsWith("deb/")) console.log(r.path)' | sort) \
               <(cd build/channel && find deb/debian -name '*.deb' | sort)

      - name: Main has not moved since the plan, before the index is regenerated
        env:
          PLANNED: ${{ needs.plan.outputs.sha }}
          PUBLISH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: .self/.github/prune/unmoved.sh build/channel "$PLANNED"

      - name: Regenerate and sign the index
        env:
          CHANGELOGS_URL: https://www.openmixer.org/deb/changelogs
        run: |
          set -euo pipefail
          # publish-tree.sh takes <suite>/<package>.deb; given the kept packages it adds nothing and rewrites
          # Packages, Release, InRelease and Release.gpg of every suite
          for suite in build/channel/deb/debian/*/; do
            s=$(basename "$suite"); mkdir -p "staging/$s"
            find "$suite" -name '*.deb' -exec cp -t "staging/$s" {} +
          done
          COSIGN=${OPENMIXER_GPG_COSIGN_KEY_ID:-} .fmx/.github/actions/publish-debs/publish-tree.sh build/channel/deb staging "$OPENMIXER_GPG_KEY_ID"
          for d in build/channel/deb/debian/*/; do
            test -s "$d/InRelease" || { echo "::error::$d has no signed index"; exit 1; }
          done

      - name: The pruned tree has nothing left to delete
        run: node .self/.github/prune/select.mjs --keep .self/keep.yml --pins plan/pins.json --keeplist plan/keep-list.txt --newest "$NEWEST" --drop "$DROP" --tree build/channel --only deb --expect-clean

      # the last check before the push; after it, a moved main refuses the push as not a fast-forward (its parent
      # is the planned commit), and channel-push has no rebuild here and never forces: a lost race fails the job
      - name: Main has not moved since the plan, before the push
        env:
          PLANNED: ${{ needs.plan.outputs.sha }}
          PUBLISH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: .self/.github/prune/unmoved.sh build/channel "$PLANNED"

      - uses: Open-Mixer/.github/.github/actions/channel-push@openmixer-v1
        with:
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ github.repository }}
          tag: prune-${{ github.run_id }}
          what: deb

  verify-dnf:
    name: Kept RPMs install (fedora:44)
    needs: [plan, deb]
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:44
    env:
      DROP: ${{ inputs.drop }}
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git curl findutils diffutils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            keep.yml
            .github/prune
            rpm/fedora/44/x86_64/repodata/repomd.xml
            rpm/fedora/44/noarch/repodata/repomd.xml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: prune-plan
          path: plan
      - name: Wait for Pages to serve the pruned metadata
        run: |
          # ends on the repomd revision the prune published; a slow publish is waited for, to the deadline
          for d in x86_64 noarch; do
            node .github/prune/await.mjs "https://www.openmixer.org/rpm/fedora/44/$d/repodata/repomd.xml" "rpm/fedora/44/$d/repodata/repomd.xml" 3000 10 || exit 1
          done
      - name: Every kept version installs, and the newest resolves
        run: |
          set -uo pipefail
          # the channel is set up the way a user does it: the release package from its fixed URL. It stays
          # installed: removing it in the loop below would take the repository away from every later package.
          dnf -y install https://www.openmixer.org/rpm/openmixer-release.noarch.rpm >/dev/null
          dnf -y makecache
          node .github/prune/expect.mjs --plan plan/plan.json --format rpm --repo fedora/44 --arch x86_64 > expect.txt
          # drop mode removed named versions only: the other builds were not touched, so the check is the newest
          if [ -n "$DROP" ]; then grep '^newest' expect.txt > expect.newest && mv expect.newest expect.txt; fi
          fail=0
          while read -r what a b; do
            if [ "$what" = install ]; then
              case $a in openmixer-release-*) echo "installs   $a (the channel's own setup)"; continue ;; esac
              if dnf -y install "$a" >/dev/null && dnf -y remove "$a" >/dev/null; then echo "installs   $a"
              else echo "::error::$a does not install"; fail=1; fi
            else
              got=$(dnf repoquery -q --repo openmixer --repo openmixer-noarch --latest-limit=1 --qf '%{evr}\n' "$a" | head -1)
              if [ "$got" = "$b" ]; then echo "newest     $a $b"; else echo "::error::$a resolves to '$got', not $b"; fail=1; fi
            fi
          done < expect.txt
          exit $fail

  verify-apt:
    name: Kept DEBs install (debian:bookworm)
    needs: [plan, deb]
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      DROP: ${{ inputs.drop }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            keep.yml
            .github/prune
            deb/debian/bookworm/InRelease
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: prune-plan
          path: plan
      - name: Wait for Pages to serve the pruned index
        run: |
          for _ in $(seq 60); do
            curl -fsSL https://www.openmixer.org/deb/debian/bookworm/InRelease | cmp -s - deb/debian/bookworm/InRelease && exit 0
            sleep 10
          done
          echo "::error::Pages still serves the old bookworm index"; exit 1
      - name: Every kept version installs, and the newest resolves
        run: |
          set -uo pipefail
          # the channel is set up the way a user does it: the release package from its fixed URL. A source
          # written here as well would carry another Signed-By and apt refuses the pair. The package stays
          # installed: purging it in the loop below would take the source away from every later package.
          curl -fsSL -o /tmp/openmixer-release.deb https://www.openmixer.org/deb/openmixer-release.deb
          apt-get install -y -qq /tmp/openmixer-release.deb >/dev/null
          apt-get update -qq
          node .github/prune/expect.mjs --plan plan/plan.json --format deb --repo debian/bookworm --arch amd64 > expect.txt
          # drop mode removed named versions only: the other builds were not touched, so the check is the newest
          if [ -n "$DROP" ]; then grep '^newest' expect.txt > expect.newest && mv expect.newest expect.txt; fi
          fail=0
          while read -r what a b; do
            if [ "$what" = install ]; then
              case $a in openmixer-release=*) echo "installs   $a (the channel's own setup)"; continue ;; esac
              specs=${a//,/ }
              # shellcheck disable=SC2086,SC2046 # one word per package
              if apt-get install -y -qq $specs >/dev/null && apt-get purge -y -qq --autoremove $(printf '%s\n' $specs | sed 's/=.*//') >/dev/null; then echo "installs   $a"
              else echo "::error::$a does not install"; fail=1; fi
            else
              got=$(apt-cache policy "$a" | awk '/Candidate:/ {print $2}')
              if [ "$got" = "$b" ]; then echo "newest     $a $b"; else echo "::error::$a resolves to '$got', not $b"; fail=1; fi
            fi
          done < expect.txt
          exit $fail
